<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoFill IA</title>
<meta name="description" content="Extensão que preenche formulários em 1 clique ou no automático, com IA gratuita para os campos difíceis.">
<meta property="og:image" content="https://manoelvilar.github.io/autofill-ia/social-preview.png">
<link rel="icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root { --bg:#0b1020; --fg:#eef1f8; --muted:#9aa8c4; --line:#26304a; --card:#131a2c; --accent:#8ea0ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width:1040px; margin:0 auto; padding:32px max(16px, env(safe-area-inset-left)) 56px; }
.hero img { width:100%; border-radius:14px; display:block; border:1px solid var(--line); }
.links { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-top:22px; }
.links a { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; color:var(--fg); text-decoration:none; }
.links a:hover, .links a:focus-visible { border-color:var(--accent); outline:none; }
.links b { display:block; font-size:1.02rem; }
.links span { color:var(--muted); font-size:.9rem; }
footer { color:var(--muted); font-size:.85rem; margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="capa.png" alt="AutoFill IA: preenche qualquer formulário em 1 clique ou no automático"></div>
  <nav class="links">
    <a href="https://github.com/ManoelVilar/autofill-ia"><b>Código e instalação</b><span>Repositório no GitHub com o passo a passo</span></a>
    <a href="teste.html"><b>Formulário de teste</b><span>Confira a extensão com o placar automático</span></a>
    <a href="privacidade.html"><b>Política de privacidade</b><span>O que a extensão guarda e o que nunca envia</span></a>
  </nav>
  <footer>AutoFill IA · código aberto · feito por Manoel Vilar</footer>
</div>
</body>
</html>
